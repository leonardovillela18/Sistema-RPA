<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RPA</title>
<link rel="stylesheet" href="../styles/site-auth.css">
<style>
:root{
--bg:#202124;
--surface:#171717;
--text:#f1f3f4;
--muted:#bdc1c6;
--accent:#f2c316;
--accent-strong:#d9ad0d;
--header-h:86px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}

header{
background:#000;
padding:15px 60px;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
width:100%;
top:0;
z-index:1000;
gap:18px;
flex-wrap:wrap;
}

.logo img{height:auto;max-height:70px;width:auto;display:block;max-width:200px}
nav ul{display:flex;list-style:none;gap:30px;flex-wrap:wrap;justify-content:flex-end}
nav a{color:#bbb;text-decoration:none;font-weight:700;transition:0.3s}
nav a:hover{color:#fff}

main{
padding:calc(var(--header-h) + 24px) 0 34px;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
width:min(460px,92%);
background:var(--surface);
border-radius:18px;
padding:26px;
box-shadow:0 18px 48px rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.05);
}

.login-card h1{
font-size:clamp(1.8rem,4vw,2.2rem);
margin-bottom:18px;
color:#fff;
}

.access-switch{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:16px;
}

.switch-btn{
border:none;
border-radius:10px;
padding:11px 12px;
font-weight:800;
cursor:pointer;
background:#2a2a2a;
color:#fff;
}

.switch-btn.active{
background:var(--accent);
color:#171717;
}

.access-panel{display:none}
.access-panel.active{display:block}

.field{display:grid;gap:8px;margin-bottom:14px}
.field label{font-weight:700;color:#e7e7e7}
.field input{
width:100%;
border-radius:12px;
border:1px solid rgba(255,255,255,0.12);
background:#1e1e1e;
color:var(--text);
padding:12px 14px;
outline:none;
}

.field input:focus{border-color:rgba(242,195,22,0.85);box-shadow:0 0 0 3px rgba(242,195,22,0.12)}

.login-btn{
width:100%;
border:none;
border-radius:12px;
padding:13px 16px;
background:var(--accent);
color:#171717;
font-weight:800;
cursor:pointer;
margin-top:2px;
}

.login-btn:hover{background:var(--accent-strong)}

.message{min-height:24px;margin-top:12px;font-weight:700}
.message.error{color:#ffb4b4}
.message.success{color:#8ae08a}

.admin-section{
margin-top:32px;
padding-top:26px;
border-top:1px solid rgba(255,255,255,0.1);
}

.edit-contacts-btn{
width:100%;
border:none;
border-radius:12px;
padding:13px 16px;
background:#405ba6;
color:#fff;
font-weight:800;
cursor:pointer;
transition:background 0.25s;
}

.edit-contacts-btn:hover{background:#3048a0}

.contact-modal-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,0.72);
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:2000;
}

.contact-modal-backdrop.open{display:flex}

.contact-modal{
width:min(720px,100%);
background:#1e1e1e;
border-radius:18px;
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 22px 60px rgba(0,0,0,0.45);
padding:28px;
max-height:90vh;
overflow-y:auto;
}

.contact-modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.contact-modal-head h2{font-size:1.5rem;margin-bottom:6px;color:#fff}
.contact-modal-head p{color:var(--muted);line-height:1.5;font-size:0.95rem}
.contact-close-btn{background:transparent;border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;flex-shrink:0}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact-field{display:grid;gap:8px}
.contact-field.full{grid-column:1 / -1}
.contact-field label{font-weight:700;color:#e7e7e7;font-size:0.95rem}
.contact-field input,.contact-field textarea{
width:100%;
border-radius:10px;
border:1px solid rgba(255,255,255,0.12);
background:#141414;
color:var(--text);
padding:12px 14px;
outline:none;
font-family:inherit;
}
.contact-field textarea{min-height:80px;resize:vertical}
.contact-field input:focus,.contact-field textarea:focus{border-color:rgba(242,195,22,0.8);box-shadow:0 0 0 3px rgba(242,195,22,0.12)}

.contact-actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px}
.contact-actions button{border:none;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}
.contact-actions .secondary-btn{background:#2a2a2a;color:#fff}
.contact-actions .secondary-btn:hover{background:#323232}
.contact-actions .primary-btn{background:var(--accent);color:#171717}
.contact-actions .primary-btn:hover{background:var(--accent-strong)}

footer{background:#000;color:#aaa;text-align:center;padding:22px}

@media (max-width:900px){
header{padding:12px 20px}
nav ul{gap:15px}
}

@media (max-width:560px){
main{padding-top:96px}
.login-card{padding:22px}
}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="../../img/RPA_Logo.jpeg" alt="Logo RPA Peças Automotivas">
</div>
<nav>
<ul>
<li><a href="index.html">HOME</a></li>
<li><a href="servicos.html">SERVIÇOS</a></li>
<li><a href="produtos.html">PRODUTOS</a></li>
<li><a href="sobre.html">SOBRE NÓS</a></li>
<li><a href="contato.html">CONTATO</a></li>
</ul>
</nav>
</header>

<main>
<section class="login-card">
<h1>Logar no sistema</h1>
<div class="access-switch">
<button class="switch-btn active" type="button" id="switchLogin">Logar</button>
<button class="switch-btn" type="button" id="switchRegister">Cadastrar</button>
</div>

<form id="loginForm" class="access-panel active">
<div class="field">
<label for="loginUser">Login</label>
<input id="loginUser" type="text" autocomplete="username" required>
</div>
<div class="field">
<label for="loginPassword">Senha</label>
<input id="loginPassword" type="password" autocomplete="current-password" required>
</div>
<button class="login-btn" type="submit">Logar</button>
</form>

<form id="registerForm" class="access-panel">
<div class="field">
<label for="fullName">Nome completo</label>
<input id="fullName" type="text" autocomplete="name" required>
</div>
<div class="field">
<label for="registerLogin">Login</label>
<input id="registerLogin" type="text" autocomplete="username" required>
</div>
<div class="field">
<label for="registerEmail">Email</label>
<input id="registerEmail" type="email" autocomplete="email" required>
</div>
<div class="field">
<label for="registerPassword">Senha</label>
<input id="registerPassword" type="password" autocomplete="new-password" required>
</div>
<button class="login-btn" type="submit">Cadastrar</button>
</form>

<div class="message" id="authMessage"></div>

<div class="admin-section" data-admin-only hidden>
<button class="edit-contacts-btn" type="button" id="openAdminContactEditor">Editar Contatos</button>
</div>
</section>
</main>

<div class="contact-modal-backdrop" id="adminContactModal">
<div class="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
<div class="contact-modal-head">
<div>
<h2 id="contactModalTitle">Editar Contatos</h2>
<p>Atualize os dados de telefone, email, Instagram, endereço e links dos mapas.</p>
</div>
<button class="contact-close-btn" type="button" id="closeAdminContactEditor" aria-label="Fechar">×</button>
</div>

<form id="adminContactForm">
<div class="contact-grid">
<div class="contact-field full">
<label for="adminPhoneLabel">Telefone exibido</label>
<input id="adminPhoneLabel" type="text" required>
</div>
<div class="contact-field full">
<label for="adminPhoneLink">Link do telefone</label>
<input id="adminPhoneLink" type="text" required>
</div>
<div class="contact-field full">
<label for="adminEmailLabel">Email exibido</label>
<input id="adminEmailLabel" type="email" required>
</div>
<div class="contact-field full">
<label for="adminEmailLink">Link do email</label>
<input id="adminEmailLink" type="text" required>
</div>
<div class="contact-field full">
<label for="adminInstagramLabel">Instagram exibido</label>
<input id="adminInstagramLabel" type="text" required>
</div>
<div class="contact-field full">
<label for="adminInstagramLink">Link do Instagram</label>
<input id="adminInstagramLink" type="text" required>
</div>
<div class="contact-field full">
<label for="adminAddress">Endereço</label>
<textarea id="adminAddress" required></textarea>
</div>
<div class="contact-field full">
<label for="adminMapsLink">Link do Google Maps</label>
<input id="adminMapsLink" type="text" required>
</div>
<div class="contact-field full">
<label for="adminMapsEmbed">Link embed do mapa</label>
<input id="adminMapsEmbed" type="text" required>
</div>
</div>

<div class="contact-actions">
<button class="secondary-btn" type="button" id="cancelAdminContactEditor">Cancelar</button>
<button class="primary-btn" type="submit">Salvar Contatos</button>
</div>
</form>
</div>
</div>

<footer>
© 2026 RPA Peças Automotivas
</footer>

<script src="../../backend/database/virtual-db.js"></script>
<script src="../scripts/site-auth.js"></script>
<script>
const messageEl = document.getElementById('authMessage');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const loginUser = document.getElementById('loginUser');
const loginPassword = document.getElementById('loginPassword');
const switchLogin = document.getElementById('switchLogin');
const switchRegister = document.getElementById('switchRegister');
const params = new URLSearchParams(window.location.search);

function showMessage(text, type) {
	messageEl.textContent = text;
	messageEl.className = `message ${type || ''}`.trim();
}

function setPanel(mode) {
	const showLogin = mode !== 'register';
	loginForm.classList.toggle('active', showLogin);
	registerForm.classList.toggle('active', !showLogin);
	switchLogin.classList.toggle('active', showLogin);
	switchRegister.classList.toggle('active', !showLogin);
}

switchLogin.addEventListener('click', () => setPanel('login'));
switchRegister.addEventListener('click', () => setPanel('register'));

if (params.get('logout') === '1') {
	RPAAuth.logout();
	try {
		sessionStorage.clear();
	} catch (error) {
		// ignore storage errors
	}
	showMessage('Logout realizado. Faça login novamente.', 'success');
	setPanel('login');
}

if (params.get('mode') === 'register') {
	setPanel('register');
}

loginForm.addEventListener('submit', (event) => {
	event.preventDefault();
	const result = RPAAuth.login(loginUser.value.trim(), loginPassword.value.trim());
	if (!result.ok) {
		showMessage(result.message, 'error');
		return;
	}

	showMessage('Login realizado com sucesso.', 'success');
	setTimeout(() => {
		window.location.href = 'index.html';
	}, 350);
});

registerForm.addEventListener('submit', (event) => {
	event.preventDefault();
	const result = RPAAuth.register({
		fullName: document.getElementById('fullName').value,
		login: document.getElementById('registerLogin').value,
		email: document.getElementById('registerEmail').value,
		password: document.getElementById('registerPassword').value
	});

	if (!result.ok) {
		showMessage(result.message, 'error');
		return;
	}

	showMessage('Cadastro realizado com sucesso.', 'success');
	setTimeout(() => {
		window.location.href = 'index.html';
	}, 350);
});

// Admin Contact Editor
const adminContactModal = document.getElementById('adminContactModal');
const openAdminContactEditor = document.getElementById('openAdminContactEditor');
const closeAdminContactEditor = document.getElementById('closeAdminContactEditor');
const cancelAdminContactEditor = document.getElementById('cancelAdminContactEditor');
const adminContactForm = document.getElementById('adminContactForm');

function fillAdminContactForm() {
	const contacts = RPADb.getContacts();
	document.getElementById('adminPhoneLabel').value = contacts.phoneLabel || '';
	document.getElementById('adminPhoneLink').value = contacts.phoneLink || '';
	document.getElementById('adminEmailLabel').value = contacts.emailLabel || '';
	document.getElementById('adminEmailLink').value = contacts.emailLink || '';
	document.getElementById('adminInstagramLabel').value = contacts.instagramLabel || '';
	document.getElementById('adminInstagramLink').value = contacts.instagramLink || '';
	document.getElementById('adminAddress').value = contacts.address || '';
	document.getElementById('adminMapsLink').value = contacts.mapsLink || '';
	document.getElementById('adminMapsEmbed').value = contacts.mapsEmbed || '';
}

function openAdminContactModal() {
	fillAdminContactForm();
	adminContactModal.classList.add('open');
}

function closeAdminContactModal() {
	adminContactModal.classList.remove('open');
}

openAdminContactEditor?.addEventListener('click', openAdminContactModal);
closeAdminContactEditor?.addEventListener('click', closeAdminContactModal);
cancelAdminContactEditor?.addEventListener('click', closeAdminContactModal);

adminContactModal?.addEventListener('click', (event) => {
	if (event.target === adminContactModal) {
		closeAdminContactModal();
	}
});

adminContactForm?.addEventListener('submit', (event) => {
	event.preventDefault();
	RPADb.saveContacts({
		phoneLabel: document.getElementById('adminPhoneLabel').value.trim(),
		phoneLink: document.getElementById('adminPhoneLink').value.trim(),
		emailLabel: document.getElementById('adminEmailLabel').value.trim(),
		emailLink: document.getElementById('adminEmailLink').value.trim(),
		instagramLabel: document.getElementById('adminInstagramLabel').value.trim(),
		instagramLink: document.getElementById('adminInstagramLink').value.trim(),
		address: document.getElementById('adminAddress').value.trim(),
		mapsLink: document.getElementById('adminMapsLink').value.trim(),
		mapsEmbed: document.getElementById('adminMapsEmbed').value.trim()
	});
	RPAAuth.syncContactFields();
	closeAdminContactModal();
	showMessage('Contatos atualizados com sucesso!', 'success');
});

</script>

</body>
</html>
