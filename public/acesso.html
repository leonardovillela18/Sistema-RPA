<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - RPA</title>

<link rel="stylesheet" href="/assets/css/acesso.css?v=20260929-4">
<link rel="stylesheet" href="/assets/css/site-auth.css?v=20260929-4">
</head>
<body>

<script src="/assets/js/navigation.js?v=20260929-4"></script>

<main>
<section class="login-card">
<h1>Acesso ao sistema</h1>


<form id="loginForm" class="login-form">
<div class="field">
<label for="loginUser">Login</label>
<input id="loginUser" type="text" autocomplete="username" required>
</div>
<div class="field">
<label for="loginPassword">Senha</label>
<input id="loginPassword" type="password" autocomplete="current-password" required>
</div>
<button class="login-btn" type="submit">Logar</button>
</form>



<div class="message" id="authMessage"></div>

</section>
</main>

<footer>
© 2026 RPA Peças Automotivas
</footer>

<script src="/assets/js/api.js?v=20260929-4"></script>
<script src="/assets/js/site-auth.js?v=20260929-4"></script>
<script src="/assets/js/acesso.js?v=20260929-4"></script>

</body>
</html>
