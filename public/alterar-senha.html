<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha - RPA</title>

<link rel="stylesheet" href="/assets/css/acesso.css">
<link rel="stylesheet" href="/assets/css/site-auth.css">
</head>
<body>

<script src="/assets/js/navigation.js"></script>

<main>
<section class="login-card">
<h1>Crie sua nova senha</h1><p>Antes de usar o sistema, substitua a senha fornecida pelo administrador por uma senha pessoal.</p>


<form id="passwordForm" class="login-form">
<div class="field"><label for="currentPassword">Senha fornecida pelo administrador</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="newPassword">Nova senha pessoal</label><input id="newPassword" name="password" type="password" autocomplete="new-password" required></div>
<div class="field"><label for="confirmNewPassword">Confirmar nova senha</label><input id="confirmNewPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
<p>Use pelo menos 12 caracteres, até 72 bytes. A nova senha precisa ser diferente da anterior.</p>
<button type="submit" class="login-btn" disabled>Salvar senha e entrar</button>
</form>



<div class="message" id="authMessage"></div>

</section>
</main>

<footer>
© 2026 RPA Peças Automotivas
</footer>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/site-auth.js"></script>
<script src="/assets/js/alterar-senha.js"></script>

</body>
</html>
