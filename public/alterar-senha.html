<section class="login-card">
<h1>Escolha sua nova senha</h1><p>Para continuar, substitua a senha fornecida pelo administrador por uma senha pessoal.</p>


<form id="passwordForm" class="login-form">
<div class="field"><label for="currentPassword">Senha atual</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="password">Nova senha</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
<div class="field"><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required></div>
<p>Use pelo menos 12 caracteres, até 72 bytes. Escolha uma senha diferente da atual.</p>
<button type="submit" class="login-btn" disabled>Salvar nova senha</button>
</form>
