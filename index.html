<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPA Peças Automotivas</title>

<style>
:root{
--bg:#0f0f0f;
--surface:#171717;
--text:#ffffff;
--muted:#dddddd;
--accent:#f2c316;
--header-h:86px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Tahoma,sans-serif}

body{background:var(--bg);color:#222;min-height:100vh}

header{
background:#000;
padding:15px 60px;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
width:100%;
top:0;
z-index:1000;
}

.logo img{height:54px;width:auto;display:block}

nav ul{display:flex;list-style:none;gap:30px;flex-wrap:wrap;justify-content:flex-end}

nav a{color:#bbb;text-decoration:none;font-weight:700;transition:0.3s}
nav a:hover{color:#fff}

main{padding-top:var(--header-h);min-height:calc(100vh - 70px)}

.hero{
position:relative;
width:100%;
min-height:calc(100vh - var(--header-h));
display:flex;
align-items:center;
padding:40px 0;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(90deg,rgba(0,0,0,0.82) 0%,rgba(0,0,0,0.56) 46%,rgba(0,0,0,0.2) 100%),
url("https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=1800&q=80") center/cover no-repeat;
}

.hero-inner{
position:relative;
width:min(1200px,92%);
margin:0 auto;
display:grid;
grid-template-columns:minmax(320px,620px) 1fr;
align-items:center;
}

.hero-text{color:var(--text)}

.hero-text h1{font-size:clamp(2rem,5vw,4rem);margin-bottom:18px;line-height:1.08;font-weight:800}
.hero-text h1 span{color:var(--accent)}

.hero-text p{margin-bottom:28px;color:var(--muted);font-size:clamp(1rem,1.9vw,1.95rem);max-width:30ch;line-height:1.35}

.hero button{
padding:13px 28px;
background:var(--accent);
color:#171717;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:700;
transition:0.25s;
}

.hero button:hover{background:#d9ad0d}

.hero-right{min-height:200px}

footer{background:#000;color:#aaa;text-align:center;padding:22px}

@media (max-width:900px){
header{padding:12px 20px}
nav ul{gap:15px}
.hero{min-height:74vh}
.hero-inner{grid-template-columns:1fr}
.hero-text p{max-width:36ch}
}

@media (max-width:560px){
.logo img{height:44px}
nav a{font-size:0.85rem}
main{padding-top:96px}
.hero{min-height:78vh}
}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="../img/RPA_Logo.jpeg">
</div>
<nav>
<ul>
<li><a href="index.html">HOME</a></li>
<li><a href="servicos.html">SERVIÇOS</a></li>
<li><a href="produtos.html">PRODUTOS</a></li>
<li><a href="sobre.html">SOBRE</a></li>
<li><a href="contato.html">CONTATO</a></li>
</ul>
</nav>
</header>

<main>
<section class="hero">
<div class="hero-inner">
<div class="hero-text">
<h1>RPA Autocenter,<br>a sua mecânica<br><span>de confiança</span></h1>
<p>Aqui voce encontra a melhor manutencao para o seu caminhao, com atendimento rapido e equipe especializada.</p>
<a href="contato.html">
<button>FAZER ORCAMENTO</button>
</a>
</div>
<div class="hero-right"></div>
</div>
</section>
</main>

<footer>
© 2026 RPA Peças Automotivas
</footer>

</body>
</html>
